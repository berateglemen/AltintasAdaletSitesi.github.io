<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apsiyon'a Geçiş - Altıntaş Adalet Sitesi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --mavi: #1e40af;
            --mavi-acik: #3b82f6;
            --mavi-koyu: #1e3a8a;
            --mavi-bg: #eff6ff;
        }

        * { box-sizing: border-box; }

        body { 
            background: linear-gradient(135deg, #eff6ff 0%, #ffffff 50%, #dbeafe 100%);
            color: #1e293b; 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
        }

        .kart { 
            background: #ffffff;
            border: 1px solid #dbeafe;
            padding: 60px 40px; 
            border-radius: 30px; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            box-shadow: 0 20px 60px rgba(30, 64, 175, 0.12);
        }

        /* Büyük Apsiyon Logo Alanı */
        .apsiyon-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            min-height: 100px;
        }

        .apsiyon-logo img {
            max-height: 90px;
            max-width: 100%;
            object-fit: contain;
        }

        /* Logo yüklenmezse büyük yazı fallback */
        .apsiyon-yazi {
            display: none;
            font-weight: 900;
            font-size: 56px;
            letter-spacing: -1px;
            line-height: 1;
        }

        .apsiyon-yazi .ap { color: var(--mavi); }
        .apsiyon-yazi .siyon { color: var(--mavi-acik); }

        h1 { 
            font-weight: 900; 
            font-size: 26px;
            margin: 0 0 15px; 
            letter-spacing: 1px;
            color: var(--mavi-koyu);
            line-height: 1.3;
        }
        
        h1 span { color: var(--mavi-acik); }

        .bilgi-metni {
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
            margin: 20px 0 35px;
        }

        .bilgi-metni b {
            color: var(--mavi);
        }

        /* Büyük Yönlendirme Butonu */
        .apsiyon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 22px; 
            border-radius: 18px; 
            border: none; 
            background: linear-gradient(135deg, var(--mavi) 0%, var(--mavi-acik) 100%);
            color: #ffffff; 
            font-weight: 900; 
            font-size: 18px;
            cursor: pointer; 
            transition: 0.3s;
            letter-spacing: 1.5px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.25);
        }

        .apsiyon-btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 18px 40px rgba(30, 64, 175, 0.4); 
        }

        .apsiyon-btn i {
            font-size: 20px;
        }

        .uyari-box {
            background: var(--mavi-bg);
            border: 1px solid #bfdbfe;
            border-radius: 15px;
            padding: 18px;
            margin-top: 30px;
            font-size: 13px;
            color: var(--mavi-koyu);
            line-height: 1.6;
            text-align: left;
        }

        .uyari-box i {
            color: var(--mavi-acik);
            margin-right: 8px;
        }

        @media (max-width: 480px) {
            .kart { padding: 40px 25px; }
            h1 { font-size: 22px; }
            .apsiyon-yazi { font-size: 44px; }
            .apsiyon-btn { font-size: 16px; padding: 18px; }
        }
    </style>
</head>
<body>

    <div class="kart">
        <!-- Büyük Apsiyon Logo Alanı -->
        <div class="apsiyon-logo">
            <img src="https://www.apsiyon.com/images/logo.svg" 
                 alt="Apsiyon Logo"
                 onerror="this.style.display='none'; document.querySelector('.apsiyon-yazi').style.display='block';">
            <div class="apsiyon-yazi">
                <span class="ap">AP</span><span class="siyon">SİYON</span>
            </div>
        </div>

        <h1>BORÇ SORGULAMA <span>APSİYON'A</span> TAŞINDI</h1>

        <p class="bilgi-metni">
            Güncel borç durumunuzu öğrenmek ve ödeme yapmak için artık <b>Apsiyon</b> platformunu kullanmanız gerekmektedir.
        </p>

        <!-- Büyük Yönlendirme Butonu -->
        <a href="https://www.apsiyon.com/" target="_blank" rel="noopener" class="apsiyon-btn">
            <i class="fa fa-external-link"></i> APSİYON'A GİT
        </a>

        <div class="uyari-box">
            <i class="fa fa-info-circle"></i>
            Borç bilgileriniz ve ödeme işlemleriniz için lütfen Apsiyon platformunu kullanınız.
        </div>
    </div>

</body>
</html>
