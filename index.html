<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bilgilendirme - Altıntaş Adalet Sitesi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --vurgu: #f39c12; 
            --bg: #0b0f1a; 
            --glass: rgba(255, 255, 255, 0.03); 
            --glass-border: rgba(255, 255, 255, 0.1); 
        }

        body { 
            background: radial-gradient(circle at center, #1a202c 0%, #0b0f1a 100%);
            color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            overflow: hidden;
        }

        /* Arka plan süslemeleri */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--vurgu);
            filter: blur(150px);
            opacity: 0.1;
            top: 10%;
            left: 10%;
            z-index: -1;
        }

        .kart { 
            background: var(--glass); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); 
            padding: 50px 40px; 
            border-radius: 40px; 
            width: 90%; 
            max-width: 420px; 
            text-align: center; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transition: 0.4s ease;
        }

        .logo-area i {
            font-size: 50px;
            color: var(--vurgu);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(243, 156, 18, 0.3));
        }

        h2 { 
            font-weight: 900; 
            font-size: 22px;
            margin-bottom: 15px; 
            letter-spacing: 2px;
            line-height: 1.4;
        }
        
        h2 span { color: var(--vurgu); }

        .bilgi-metni {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.7;
            margin: 20px 0 30px;
        }

        .bilgi-metni b {
            color: #fff;
        }

        /* Apsiyon Logo Alanı */
        .apsiyon-logo {
            margin: 25px 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .apsiyon-logo img {
            height: 40px;
            width: auto;
            object-fit: contain;
            filter: brightness(0) invert(1);
            opacity: 0.9;
        }

        /* Yönlendirme Butonu */
        .apsiyon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px; 
            margin-top: 10px; 
            border-radius: 18px; 
            border: none; 
            background: var(--vurgu); 
            color: #000; 
            font-weight: 900; 
            font-size: 15px;
            cursor: pointer; 
            transition: 0.3s;
            letter-spacing: 1px;
            text-decoration: none;
            box-sizing: border-box;
        }

        .apsiyon-btn:hover { 
            transform: scale(1.03); 
            box-shadow: 0 10px 25px rgba(243, 156, 18, 0.4); 
            filter: brightness(1.1);
        }

        .apsiyon-btn i {
            font-size: 18px;
        }

        .back-btn { 
            display: inline-block; 
            margin-top: 30px; 
            color: #94a3b8; 
            text-decoration: none; 
            font-size: 12px; 
            font-weight: 700;
            transition: 0.3s;
        }
        
        .back-btn:hover { color: var(--vurgu); }

        .uyari-box {
            background: rgba(243, 156, 18, 0.08);
            border: 1px dashed rgba(243, 156, 18, 0.3);
            border-radius: 15px;
            padding: 15px;
            margin-top: 25px;
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .uyari-box i {
            color: var(--vurgu);
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="kart">
        <div class="logo-area">
            <i class="fa fa-shield"></i>
        </div>
        <h2>BORÇ <span>SORGULAMA</span></h2>

        <p class="bilgi-metni">
            Güncel borç durumunuzu öğrenmek için artık <b>Apsiyon</b> uygulamasına geçilmiştir.
        </p>

        <!-- Apsiyon Logo Alanı -->
        <div class="apsiyon-logo">
            <!-- Apsiyon logosu (metin tabanlı fallback ile birlikte) -->
            <img src="https://www.apsiyon.com/images/logo.svg" 
                 alt="Apsiyon Logo" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div style="display:none; font-weight:900; font-size:24px; letter-spacing:1px;">
                <span style="color:#fff;">AP</span><span style="color:var(--vurgu);">SİYON</span>
            </div>
        </div>

        <!-- Yönlendirme Butonu -->
        <a href="https://www.apsiyon.com/" target="_blank" rel="noopener" class="apsiyon-btn">
            <i class="fa fa-external-link"></i> APSİYON'A GİT
        </a>

        <div class="uyari-box">
            <i class="fa fa-info-circle"></i>
            Borç bilgileriniz ve ödeme işlemleriniz için lütfen Apsiyon platformunu kullanınız.
        </div>

        <a href="anamenu.html" class="back-btn">
            <i class="fa fa-chevron-left"></i> MENÜYE DÖN
        </a>
    </div>

</body>
</html>
